
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Ring Accent -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.3" />

  <!-- Central Emblem Container -->
  <g filter="url(#shadow)">
    <!-- Sudan Flag Tri-color Arc Ribbon -->
    <path d="M136 120 C 200 80, 312 80, 376 120" stroke="#ef4444" stroke-width="12" stroke-linecap="round" fill="none" />
    <path d="M120 144 C 190 100, 322 100, 392 144" stroke="#ffffff" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.9" />
    <path d="M104 168 C 180 120, 332 120, 408 168" stroke="#10b981" stroke-width="12" stroke-linecap="round" fill="none" />

    <!-- AI Soundwave Pulse Bars -->
    <rect x="140" y="240" width="16" height="80" rx="8" fill="url(#goldGrad)" />
    <rect x="172" y="200" width="16" height="160" rx="8" fill="url(#goldGrad)" />
    <rect x="204" y="170" width="16" height="210" rx="8" fill="url(#goldGrad)" />
    
    <!-- Central Microphone / AI Core -->
    <rect x="236" y="140" width="40" height="240" rx="20" fill="#ffffff" />
    <rect x="244" y="148" width="24" height="224" rx="12" fill="url(#goldGrad)" />
    
    <!-- Soundwave Right Bars -->
    <rect x="292" y="170" width="16" height="210" rx="8" fill="url(#goldGrad)" />
    <rect x="324" y="200" width="16" height="160" rx="8" fill="url(#goldGrad)" />
    <rect x="356" y="240" width="16" height="80" rx="8" fill="url(#goldGrad)" />

    <!-- Mic Stand / Base -->
    <path d="M216 330 C 216 380, 296 380, 296 330" stroke="#ffffff" stroke-width="12" stroke-linecap="round" fill="none" />
    <path d="M256 376 L 256 416" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
    <rect x="206" y="416" width="100" height="16" rx="8" fill="#ffffff" />

    <!-- Sparkle Stars -->
    <path d="M110 220 L 118 238 L 136 246 L 118 254 L 110 272 L 102 254 L 84 246 L 102 238 Z" fill="#fef08a" />
    <path d="M400 220 L 408 238 L 426 246 L 408 254 L 400 272 L 392 254 L 374 246 L 392 238 Z" fill="#fef08a" />
  </g>

  <!-- Text Label "SAi" -->
  <text x="256" y="475" font-family="Arial, sans-serif" font-weight="900" font-size="34" fill="#6ee7b7" text-anchor="middle" letter-spacing="4">SAi 3.5 PWA</text>
</svg>
